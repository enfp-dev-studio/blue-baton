<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Text marked data-i18n is replaced at startup with the active language (js/i18n.js); the English here is the fallback -->
<title data-i18n="app.title">Blue Baton Settings</title>
<link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="brand-name" data-i18n="app.name">Blue Baton</span>
    <span class="brand-sub" data-i18n="app.subtitle">Settings</span>
  </div>
  <div id="link"></div>
</header>

<main>
  <div id="notice"></div>
  <div id="lock"></div>

  <div id="main-sections" hidden>
    <section class="card" id="hosts"></section>

    <section class="card">
      <div id="devices"></div>
      <div id="add"></div>
    </section>

    <section class="card" id="inputs"></section>
  </div>

  <details class="card" id="log-sec">
    <summary data-i18n="log.title">Developer: communication log</summary>
    <label class="check"><input type="checkbox" id="log-board"> <span data-i18n="log.boardLines">Show board log lines too</span></label>
    <div id="log"></div>
  </details>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
