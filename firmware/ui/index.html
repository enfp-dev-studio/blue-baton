<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Text marked data-i18n is replaced at startup with the active language (js/i18n.js); the English here is the fallback -->
<title data-i18n="app.title">Blue Baton Settings</title>
<link rel="stylesheet" href="css/app.css?v=6">
</head>
<body>
<header class="top">
  <div class="brand">
    <!-- The mark: a baton (capsule) passed between two hands (dots) -->
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="bb-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7c9cff"/>
          <stop offset="1" stop-color="#2b59f5"/>
        </linearGradient>
      </defs>
      <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#bb-grad)"/>
      <rect x="7" y="13.5" width="18" height="5" rx="2.5" fill="#fff" transform="rotate(-32 16 16)"/>
      <circle cx="8" cy="23" r="1.8" fill="#fff" opacity="0.65"/>
      <circle cx="24" cy="9" r="1.8" fill="#fff"/>
    </svg>
    <div class="brand-text">
      <span class="brand-name" data-i18n="app.name">Blue Baton</span>
      <span class="brand-sub" data-i18n="app.tagline">One keyboard and mouse, three computers</span>
    </div>
  </div>
  <div id="link"></div>
</header>

<main>
  <div id="notice"></div>
  <div id="lock"></div>

  <div id="main-sections" hidden>
    <section class="panel" id="hosts"></section>

    <section class="panel">
      <div id="devices"></div>
      <div id="add"></div>
    </section>
  </div>

  <details class="panel" id="diag-sec">
    <summary data-i18n="diag.title">Diagnostics</summary>
    <section class="diag-block" id="inputs"></section>
    <div class="diag-block">
      <details id="log-sec">
        <summary data-i18n="log.title">Developer: communication log</summary>
        <label class="check"><input type="checkbox" id="log-board"> <span data-i18n="log.boardLines">Show board log lines too</span></label>
        <div id="log"></div>
      </details>
    </div>
  </details>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
