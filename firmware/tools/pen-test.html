<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pen Input Check</title>
<style>
  /*
   * Open on a host, start the pen self-test (selftest with kind "pen"), and watch what the browser gets: the pointer
   * type, pressure and tilt (Pointer Events). Mouse input draws grey, pen input draws blue with width from pressure.
   */
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --fg: #1b1f27; --muted: #6a7282; --line: #dde1e8;
    --pen: #2563eb; --mouse: #9aa1ad; --ok: #15803d; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111318; --panel: #1a1d24; --fg: #e8eaee; --muted: #9298a5; --line: #2c313b;
      --pen: #60a5fa; --mouse: #6b7280; --ok: #4ade80; --warn: #fbbf24; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111318; --panel: #1a1d24; --fg: #e8eaee; --muted: #9298a5; --line: #2c313b;
    --pen: #60a5fa; --mouse: #6b7280; --ok: #4ade80; --warn: #fbbf24; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #verdict { font-weight: 600; color: var(--muted); }
  #verdict.ok { color: var(--ok); }
  #verdict.warn { color: var(--warn); }
  dl {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 16px;
    margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  dl div { min-width: 0; }
  dt { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { position: relative; flex: 1; min-height: 240px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  button {
    font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>Pen Input Check</h1>
  <span id="verdict">Waiting for input</span>
  <button id="clear" type="button">Clear</button>
</header>
<dl>
  <div><dt>Pointer type</dt><dd id="type">–</dd></div>
  <div><dt>Event</dt><dd id="event">–</dd></div>
  <div><dt>Pressure</dt><dd id="pressure">–</dd></div>
  <div><dt>Tilt X / Y</dt><dd id="tilt">–</dd></div>
  <div><dt>Buttons</dt><dd id="buttons">–</dd></div>
  <div><dt>Pen events</dt><dd id="count">0</dd></div>
  <div><dt>Tip down</dt><dd id="down">0</dd></div>
  <div><dt>Max pressure</dt><dd id="max">–</dd></div>
  <div><dt>Pressure levels seen</dt><dd id="levels">0</dd></div>
  <div><dt>Tilt seen</dt><dd id="tiltSeen">no</dd></div>
</dl>
<main><canvas id="pad"></canvas></main>
<script>
  const $ = (id) => document.getElementById(id);
  const canvas = $('pad');
  const ctx = canvas.getContext('2d');
  const levels = new Set();
  let penEvents = 0, downEvents = 0, maxPressure = 0, tiltSeen = false, last = null;

  function fit() {
    const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * d);
    canvas.height = Math.round(r.height * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.lineCap = 'round';
    last = null;
  }

  function color(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function verdict() {
    const v = $('verdict');
    if (!penEvents) return;
    if (levels.size > 2) {
      v.textContent = tiltSeen ? 'Pen with pressure and tilt' : 'Pen with pressure (no tilt)';
      v.className = 'ok';
    } else if (downEvents) {
      v.textContent = 'Pen touches, but pressure stays ' + maxPressure.toFixed(3);
      v.className = 'warn';
    } else {
      v.textContent = 'Pen hovering, no touch yet';
      v.className = 'warn';
    }
  }

  function show(e) {
    $('type').textContent = e.pointerType || '?';
    $('event').textContent = e.type.replace('pointer', '');
    $('pressure').textContent = e.pressure.toFixed(3);
    $('tilt').textContent = `${e.tiltX} / ${e.tiltY}`;
    $('buttons').textContent = e.buttons;
  }

  function draw(e) {
    const r = canvas.getBoundingClientRect();
    const pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const p of (pts.length ? pts : [e])) {
      const x = p.clientX - r.left, y = p.clientY - r.top;
      const pen = p.pointerType === 'pen';
      const down = p.buttons !== 0;
      if (pen) {
        penEvents++;
        if (down) downEvents++;
        if (p.pressure > 0) levels.add(Math.round(p.pressure * 1000));
        maxPressure = Math.max(maxPressure, p.pressure);
        if (p.tiltX || p.tiltY) tiltSeen = true;
      }
      if (down && last && last.id === p.pointerId) {
        ctx.strokeStyle = color(pen ? '--pen' : '--mouse');
        ctx.lineWidth = pen ? 0.5 + p.pressure * 12 : 2;
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(x, y);
        ctx.stroke();
      }
      last = down ? { id: p.pointerId, x, y } : null;
    }
    $('count').textContent = penEvents;
    $('down').textContent = downEvents;
    $('max').textContent = penEvents ? maxPressure.toFixed(3) : '–';
    $('levels').textContent = levels.size;
    $('tiltSeen').textContent = tiltSeen ? 'yes' : 'no';
    verdict();
  }

  for (const t of ['pointerdown', 'pointermove', 'pointerup']) {
    canvas.addEventListener(t, (e) => { show(e); draw(e); });
  }
  for (const t of ['pointerover', 'pointerout', 'pointercancel']) {
    canvas.addEventListener(t, (e) => { show(e); last = null; });
  }
  $('clear').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    levels.clear();
    penEvents = 0;
    downEvents = 0;
    maxPressure = 0;
    tiltSeen = false;
    $('count').textContent = '0';
    $('down').textContent = '0';
    $('max').textContent = '–';
    $('levels').textContent = '0';
    $('tiltSeen').textContent = 'no';
    $('verdict').textContent = 'Waiting for input';
    $('verdict').className = '';
  });
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
