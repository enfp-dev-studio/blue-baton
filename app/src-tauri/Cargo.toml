[package]
name = "blue-baton"
version = "0.7.8"
description = "Blue Baton menu bar app"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
name = "blue_baton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
# Launch at login (directly, to set the macOS bundle identifier: autostart.rs)
auto-launch = "0.6"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
serialport = "4"
# Writes the bundled firmware to the board (library only: no CLI dependencies)
espflash = { version = "4.6", default-features = false, features = ["serialport"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
