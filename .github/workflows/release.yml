# Release: push a tag like v0.7.1 (the same version as the app and firmware/main/version.h). Builds macOS (Apple
# silicon, signed and notarized), Windows and Linux, signs the update files with the Tauri update key, builds the
# firmware (also carried inside the app, which offers it to the board), and creates a draft GitHub Release with
# latest.json for the in-app updater. The release notes are the version's section of CHANGELOG.md.
# Repository secrets it needs are listed in app/README.md ("Releases and updates"). The signing identity comes from
# the certificate itself.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  # One draft release first; the builds below only upload to it (no race between them creating it)
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          grep -q "\"version\": \"$v\"" app/src-tauri/tauri.conf.json || { echo "app/src-tauri/tauri.conf.json is not $v"; exit 1; }
          grep -q "KM_FW_VERSION \"$v\"" firmware/main/version.h || { echo "firmware/main/version.h is not $v"; exit 1; }
          # Release notes: this version's section of CHANGELOG.md, then the changes since the last published release
          awk -v h="## [$v]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on && !s && /^$/ {next} on {s = 1; print}' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          prev=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ] && [ "$prev" != "$TAG" ]; then link="compare/$prev...$TAG"; else link="commits/$TAG"; fi
          printf '\n**Full Changelog**: https://github.com/%s/%s\n' "$GH_REPO" "$link" >> notes.md
          id=$(gh api repos/$GH_REPO/releases --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api repos/$GH_REPO/releases -X POST -f tag_name="$TAG" -f name="Blue Baton $TAG" -F draft=true --jq .id)
          fi
          gh api repos/$GH_REPO/releases/$id -X PATCH -F body=@notes.md > /dev/null
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # Release firmware (diagnostics off) with the ESP-IDF version it is developed with
  firmware:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          docker run --rm -v "$PWD:/project" -w /project espressif/idf:v6.1
          bash -c "git config --global --add safe.directory '*' && firmware/tools/package.sh $GITHUB_REF_NAME dist"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.bin --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: blue-baton-firmware
          path: dist/*.bin
          if-no-files-found: error

  release:
    needs: [create-release, firmware]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      # Signing prints the certificate's name, which is the developer's legal name: keep it out of the log, which is
      # public with the repository. The secret holds "Developer ID Application: <name>" (app/README.md). The name is
      # masked on its own too: tauri-action also prints the certificate's organization, which is the bare name
      - name: Mask the signing name
        if: matrix.platform == 'macos-latest'
        env:
          NAME: ${{ secrets.APPLE_SIGNING_NAME }}
        run: |
          if [ -z "$NAME" ]; then echo "APPLE_SIGNING_NAME is not set"; exit 0; fi
          echo "::add-mask::$NAME"
          echo "::add-mask::${NAME#Developer ID Application: }"

      - uses: actions/checkout@v4

      - name: Bundle the firmware with the app (app/src-tauri/build.rs)
        uses: actions/download-artifact@v4
        with:
          name: blue-baton-firmware
          path: dist
      - shell: bash
        run: cp dist/blue-baton-firmware-*-esp32s3.bin app/src-tauri/firmware/blue-baton-esp32s3.bin

      - name: Linux packages (WebKitGTK, tray, serial port)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev pkg-config

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      # tauri-action notarizes the app but not the DMG around it; notarize and staple the DMG too (what users download)
      - name: Notarize and staple the DMG
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          gh release upload "${{ github.ref_name }}" "$dmg" --clobber --repo "${{ github.repository }}"
