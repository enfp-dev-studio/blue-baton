# Test build of the app for Windows and Linux and of the release firmware (run by hand from the Actions tab). The
# macOS app is built and signed on a Mac (app/release-macos.sh) or by release.yml.
name: Build (app on Windows and Linux, firmware)

on:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          docker run --rm -v "$PWD:/project" -w /project espressif/idf:v6.1
          bash -c "git config --global --add safe.directory '*' && firmware/tools/package.sh test dist"
      - uses: actions/upload-artifact@v4
        with:
          name: blue-baton-firmware
          path: dist/*.bin
          if-no-files-found: error

  build:
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the firmware with the app (app/src-tauri/build.rs)
        uses: actions/download-artifact@v4
        with:
          name: blue-baton-firmware
          path: dist
      - shell: bash
        run: cp dist/blue-baton-firmware-*-esp32s3.bin app/src-tauri/firmware/blue-baton-esp32s3.bin

      - name: Linux packages (WebKitGTK, tray, serial port)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libudev-dev pkg-config

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: app
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: blue-baton-${{ matrix.platform }}
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
